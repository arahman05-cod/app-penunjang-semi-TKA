function getOrCreateDatabaseSpreadsheet() {
  const props = PropertiesService.getScriptProperties();
  let ssId = props.getProperty(PROP_SPREADSHEET_ID);
  let ss = null;

  if (ssId) {
    try {
      ss = SpreadsheetApp.openById(ssId);
    } catch (err) {
      ss = null;
    }
  }

  if (!ss) {
    ss = SpreadsheetApp.create(DEFAULT_SPREADSHEET_TITLE);
    props.setProperty(PROP_SPREADSHEET_ID, ss.getId());
  }

  Object.keys(SHEETS_SCHEMA).forEach(function(sheetName) {
    let sheet = ss.getSheetByName(sheetName);
    if (!sheet) {
      sheet = ss.insertSheet(sheetName);
    }
    const headers = SHEETS_SCHEMA[sheetName];
    if (sheet.getLastRow() === 0) {
      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
      sheet.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#002b7a').setFontColor('#ffffff');
      sheet.setFrozenRows(1);
    }
  });

  const defaultSheet = ss.getSheetByName('Sheet1');
  if (defaultSheet && ss.getSheets().length > 1) {
    ss.deleteSheet(defaultSheet);
  }

  return ss;
}

function readSheetAsObjects(sheet, headers) {
  const lastRow = sheet.getLastRow();
  if (lastRow < 2) return [];
  const values = sheet.getRange(2, 1, lastRow - 1, headers.length).getValues();
  return values
    .filter(function(row) { return row[0] !== '' && row[0] !== null; })
    .map(function(row) {
      const obj = {};
      headers.forEach(function(key, idx) {
        obj[key] = row[idx];
      });
      return obj;
    });
}

function upsertRow(sheet, headers, record) {
  const id = String(record.id || '').trim();
  if (!id) return;
  const lastRow = sheet.getLastRow();
  let targetRow = -1;

  if (lastRow >= 2) {
    const ids = sheet.getRange(2, 1, lastRow - 1, 1).getValues();
    for (let i = 0; i < ids.length; i++) {
      if (String(ids[i][0]).trim() === id) {
        targetRow = i + 2;
        break;
      }
    }
  }

  const rowValues = headers.map(function(key) {
    const val = record[key];
    if (val === undefined || val === null) return '';
    if (typeof val === 'object') return JSON.stringify(val);
    return val;
  });

  if (targetRow > 0) {
    sheet.getRange(targetRow, 1, 1, headers.length).setValues([rowValues]);
  } else {
    sheet.appendRow(rowValues);
  }
}

function deleteRowById(sheet, id) {
  const cleanId = String(id || '').trim();
  const lastRow = sheet.getLastRow();
  if (!cleanId || lastRow < 2) return;
  const ids = sheet.getRange(2, 1, lastRow - 1, 1).getValues();
  for (let i = ids.length - 1; i >= 0; i--) {
    if (String(ids[i][0]).trim() === cleanId) {
      sheet.deleteRow(i + 2);
    }
  }
}

function jsonResponse(obj) {
  return ContentService
    .createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  try {
    const ss = getOrCreateDatabaseSpreadsheet();
    const result = { ok: true, spreadsheetUrl: ss.getUrl(), data: {} };
    Object.keys(TABLE_TO_SHEET).forEach(function(tableKey) {
      const sheetName = TABLE_TO_SHEET[tableKey];
      const sheet = ss.getSheetByName(sheetName);
      result.data[tableKey] = readSheetAsObjects(sheet, SHEETS_SCHEMA[sheetName]);
    });
    return jsonResponse(result);
  } catch (err) {
    return jsonResponse({ ok: false, error: String(err) });
  }
}

function doPost(e) {
  try {
    const ss = getOrCreateDatabaseSpreadsheet();
    const payload = JSON.parse(e.postData.contents || '{}');
    const action = payload.action || 'init';

    if (action === 'init') {
      return jsonResponse({ ok: true, spreadsheetUrl: ss.getUrl() });
    }

    if (action === 'upsert') {
      const sheetName = TABLE_TO_SHEET[payload.table];
      if (!sheetName) return jsonResponse({ ok: false, error: 'Tabel tidak dikenal' });
      upsertRow(ss.getSheetByName(sheetName), SHEETS_SCHEMA[sheetName], payload.data || {});
      return jsonResponse({ ok: true });
    }

    if (action === 'batchUpsert') {
      const items = Array.isArray(payload.items) ? payload.items : [];
      items.forEach(function(item) {
        const sheetName = TABLE_TO_SHEET[item.table];
        if (sheetName) {
          upsertRow(ss.getSheetByName(sheetName), SHEETS_SCHEMA[sheetName], item.data || {});
        }
      });
      return jsonResponse({ ok: true });
    }

    if (action === 'delete') {
      const sheetName = TABLE_TO_SHEET[payload.table];
      if (!sheetName) return jsonResponse({ ok: false, error: 'Tabel tidak dikenal' });
      deleteRowById(ss.getSheetByName(sheetName), payload.id);
      return jsonResponse({ ok: true });
    }

    return jsonResponse({ ok: false, error: 'Aksi tidak didukung' });
  } catch (err) {
    return jsonResponse({ ok: false, error: String(err) });
  }
}`;

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatWaktuID(isoStr) {
      if (!isoStr) return '-';
      try {
        const d = new Date(isoStr);
        if (Number.isNaN(d.getTime())) return String(isoStr);
        return d.toLocaleString('id-ID', {
          day: '2-digit',
          month: 'short',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        });
      } catch {
        return String(isoStr);
      }
    }

    function formatCountdown(totalSec) {
      const safe = Math.max(0, Math.floor(Number(totalSec) || 0));
      const hrs = Math.floor(safe / 3600);
      const mins = Math.floor((safe % 3600) / 60);
      const secs = safe % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return hrs > 0 ? `${pad(hrs)}:${pad(mins)}:${pad(secs)}` : `${pad(mins)}:${pad(secs)}`;
    }

      if (!container) return;

          border: 'border-emerald-200',
          badge: 'bg-emerald-600 text-white',
          icon: '✓',
          bar: 'bg-emerald-500',
          defaultTitle: 'Berhasil',
        },
        error: {
          border: 'border-rose-200',
          badge: 'bg-rose-600 text-white',
          icon: '!',
          bar: 'bg-rose-500',
          defaultTitle: 'Perhatian',
        },
        warning: {
          border: 'border-amber-200',
          badge: 'bg-amber-500 text-white',
          icon: '!',
          bar: 'bg-amber-500',
          defaultTitle: 'Peringatan',
        },
      }[type] || {
        border: 'border-sky-200',
        badge: 'bg-[#002b7a] text-white',
        icon: 'i',
        bar: 'bg-[#0095ff]',
        defaultTitle: 'Informasi',
      };

      const toastEl = document.createElement('div');
      toastEl.className = `pointer-events-auto mb-2.5 bg-white rounded-xl shadow-xl border ${palette.border} overflow-hidden animate-toast-in`;
      toastEl.innerHTML = `
        <div class="p-3.5 flex items-start gap-3">
          <span class="w-6 h-6 rounded-lg ${palette.badge} flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5">${palette.icon}</span>
          <div class="min-w-0 flex-1">
            <p class="text-xs font-extrabold text-slate-900">${escapeHtml(title || palette.defaultTitle)}</p>
            <p class="text-xs text-slate-600 mt-0.5 leading-relaxed">${escapeHtml(message)}</p>

        <div class="h-1 w-full bg-slate-100">
          <div class="h-full ${palette.bar} animate-toast-timer"></div>

      setTimeout(() => {

    function isOwnedByTeacher(record, teacher) {
      if (!record || !teacher) return false;
      const rTid = String(record.teacherId || '').trim();
      const tId = String(teacher.id || '').trim();
      if (rTid && tId && rTid === tId) return true;

      const rTok = String(record.teacherToken || '').trim().toUpperCase();
      const tTok = String(teacher.token || '').trim().toUpperCase();
      return Boolean(rTok && tTok && rTok === tTok);
    }

    function getNextQuestionOrder(teacher) {
      const wsQs = state.questions.filter((q) => isOwnedByTeacher(q, teacher));
      if (wsQs.length === 0) return 1;
      const maxOrder = wsQs.reduce((max, q) => Math.max(max, Number(q.order) || 0), 0);
      return maxOrder + 1;
    }

    function generateUniqueToken(existingTokens, subject = '') {
      const prefixClean = String(subject || 'TKA')
        .replace(/[^A-Za-z]/g, '')
        .toUpperCase()
        .slice(0, 3)
        .padEnd(3, 'X');
      const set = new Set((existingTokens || []).map((t) => String(t || '').trim().toUpperCase()));
      for (let attempt = 0; attempt < 100; attempt++) {
        const num = Math.floor(100 + Math.random() * 900);
        const candidate = `${prefixClean}${num}`;
        if (!set.has(candidate)) return candidate;
      }
      return `${prefixClean}${Date.now().toString().slice(-3)}`;
    }

    async function callGeminiTkaJson(systemPrompt, userPrompt, responseSchema) {
      const endpoint = '/api/gemini';
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 28000);

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({
            contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: {
              temperature: 0.75,
              responseMimeType: 'application/json',
              responseSchema,
            },
          }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text ?? data?.text ?? '';
        return typeof rawText === 'string' ? JSON.parse(rawText) : rawText;
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function evaluateOptionBalance(options) {
      const clean = (Array.isArray(options) ? options : [])
        .map((o) => String(o || '').trim())
        .filter((o) => o !== '');
      if (clean.length < 2) {
        return { isBalanced: true, maxVariancePercent: 0 };
      }
      const lengths = clean.map((o) => o.length);
      const maxLen = Math.max(...lengths);
      const minLen = Math.min(...lengths);
      const variance = maxLen > 0 ? Math.round(((maxLen - minLen) / maxLen) * 100) : 0;
      return {
        isBalanced: variance <= 15,
        maxVariancePercent: variance,
      };
    }

    function harmonizeGeneratedOptions(options) {
      return (Array.isArray(options) ? options : []).map((opt) =>
        String(opt || '')
          .replace(/\s+/g, ' ')
          .trim()
      );
    }

    function distributeGeneratedOptionKeys(items) {
      if (!Array.isArray(items)) return [];
      return items.map((item, idx) => {
        if (item.questionType !== 'PG' || !Array.isArray(item.options) || item.options.length < 2) {
          return item;
        }
        const opts = [...item.options];
        const currentKeyIdx =
          typeof item.correctPgIndex === 'number' && item.correctPgIndex >= 0 && item.correctPgIndex < opts.length
            ? item.correctPgIndex
            : 0;
        const targetKeyIdx = (idx * 2 + 1) % opts.length;
        if (currentKeyIdx !== targetKeyIdx) {
          const temp = opts[targetKeyIdx];
          opts[targetKeyIdx] = opts[currentKeyIdx];
          opts[currentKeyIdx] = temp;
        }
        return {
          ...item,
          options: opts,
          correctPgIndex: targetKeyIdx,
        };
      });
    }

    function normalizeQuestionRecord(raw) {
      let options = [];
      let correctAnswer = 0;
      let analysis = null;

      try {
        options = Array.isArray(raw.options)
          ? raw.options
          : raw.optionsJson
          ? JSON.parse(raw.optionsJson)
          : [];
      } catch {
        options = [];
      }

      try {
        correctAnswer =
          raw.correctAnswer !== undefined
            ? raw.correctAnswer
            : raw.correctAnswerJson !== undefined && raw.correctAnswerJson !== ''
            ? JSON.parse(raw.correctAnswerJson)
            : 0;
      } catch {
        correctAnswer = 0;
      }

      try {
        analysis =
          raw.analysis && typeof raw.analysis === 'object'
            ? raw.analysis
            : raw.analysisJson
            ? JSON.parse(raw.analysisJson)
            : null;
      } catch {
        analysis = null;
      }

      return {
        ...raw,
        options,
        correctAnswer,
        weight: Number(raw.weight) || 20,
        order: Number(raw.order) || 1,
        optionBalance: evaluateOptionBalance(options),
        analysis,
      };
    }

    function deduplicateSessionsList(sessions) {
      const map = new Map();
      (Array.isArray(sessions) ? sessions : []).forEach((s) => {
        let tpBreakdown = [];
        let answers = {};
        try {
          tpBreakdown = Array.isArray(s.tpBreakdown)
            ? s.tpBreakdown
            : s.tpBreakdownJson
            ? JSON.parse(s.tpBreakdownJson)
            : [];
        } catch {
          tpBreakdown = [];
        }
        try {
          answers =
            s.answers && typeof s.answers === 'object'
              ? s.answers
              : s.answersJson
              ? JSON.parse(s.answersJson)
              : {};
        } catch {
          answers = {};
        }

        const normalized = {
          ...s,
          score: Number(s.score) || 0,
          passed: s.passed === true || String(s.passed).toLowerCase() === 'true',
          tpBreakdown,
          answers,
        };
        const key = `${String(s.nisn || '').trim().toLowerCase()}__${String(s.teacherId || '').trim().toLowerCase()}`;
        const prev = map.get(key);
        if (!prev || (normalized.status === 'selesai' && prev.status !== 'selesai')) {
          map.set(key, normalized);
        }
      });
      return Array.from(map.values());
    }

    function mergeTeachersWithSeeds(incomingTeachers) {
      const list = Array.isArray(incomingTeachers)
        ? incomingTeachers.map((t) => ({
            ...t,
            username: String(t.username || '').trim(),
            password: String(t.password || '').trim(),
            token: String(t.token || '').trim().toUpperCase(),
            durationMinutes: Number(t.durationMinutes) || 60,
            targetQuestionCount: Number(t.targetQuestionCount) || 5,
            examOpen: t.examOpen !== false && String(t.examOpen).toLowerCase() !== 'false',
          }))
        : [];
      SEED_TEACHERS.forEach((seed) => {
        const exists = list.some(
          (t) =>
            String(t.id || '').trim() === seed.id ||
            String(t.username || '').trim().toLowerCase() === seed.username.toLowerCase()
        );
        if (!exists) {
          list.push({ ...seed });
        }
      });
      return list;
    }

    function loadLocalBackupDb() {
      try {
        const raw = localStorage.getItem(LOCAL_DB_STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.teachers) && parsed.teachers.length > 0) {
          state.teachers = mergeTeachersWithSeeds(parsed.teachers);
        }
        if (Array.isArray(parsed.tps) && parsed.tps.length > 0) {
          state.tps = parsed.tps;
        }
        if (Array.isArray(parsed.blueprints) && parsed.blueprints.length > 0) {
          state.blueprints = parsed.blueprints;
        }
        if (Array.isArray(parsed.questions) && parsed.questions.length > 0) {
          state.questions = parsed.questions.map(normalizeQuestionRecord);
        }
        if (Array.isArray(parsed.sessions)) {
          state.sessions = deduplicateSessionsList(parsed.sessions);
        }
        if (Array.isArray(parsed.teacherRegistrations)) {
          state.teacherRegistrations = parsed.teacherRegistrations;
        }
      } catch {}
    }

    async function postToSpreadsheet(payload, overrideUrl = '') {
      const targetUrl = String(overrideUrl || state.spreadsheetApiUrl || '').trim();
      if (!targetUrl || !targetUrl.startsWith('http')) return null;

      try {
        const res = await fetch(targetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
        });
        const text = await res.text();
        return JSON.parse(text);
      } catch {
        return null;
      }
    }

    async function fetchFromSpreadsheet(overrideUrl = '', silent = true) {
      const targetUrl = String(overrideUrl || state.spreadsheetApiUrl || '').trim();
      if (!targetUrl || !targetUrl.startsWith('http')) return false;

      if (!silent) setGlobalLoading(true);
      try {
        const sep = targetUrl.includes('?') ? '&' : '?';
        const res = await fetch(`${targetUrl}${sep}t=${Date.now()}`, { method: 'GET' });
        const text = await res.text();
        const parsed = JSON.parse(text);

        const data = parsed && parsed.data ? parsed.data : parsed;
        if (parsed && parsed.ok && data) {
          if (Array.isArray(data.teachers) && data.teachers.length > 0) {
            state.teachers = mergeTeachersWithSeeds(data.teachers);
          }
          if (Array.isArray(data.tps) && data.tps.length > 0) {
            state.tps = data.tps;
          }
          if (Array.isArray(data.blueprints) && data.blueprints.length > 0) {
            state.blueprints = data.blueprints;
          }
          if (Array.isArray(data.questions) && data.questions.length > 0) {
            state.questions = data.questions.map(normalizeQuestionRecord);
          }
          if (Array.isArray(data.sessions)) {
            state.sessions = deduplicateSessionsList(data.sessions);
          }
          if (Array.isArray(data.registrations)) {
            state.teacherRegistrations = data.registrations;
          }

          const ws = getWorkspaceTeacher();
          if (ws) {
            state.examDurationInput = Number(ws.durationMinutes) || 60;
            const wsQCount = state.questions.filter((q) => isOwnedByTeacher(q, ws)).length;
            state.examQuestionCountInput =
              wsQCount > 0
                ? Math.min(wsQCount, Number(ws.targetQuestionCount) || wsQCount)
                : Number(ws.targetQuestionCount) || 5;
          }

          state.spreadsheetStatus = {
            connected: true,
            lastSync: new Date().toISOString(),
            error: null,
          };
          saveLocalBackupDb();
          renderApp();
          if (!silent) showToast('Data berhasil disinkronkan dengan Google Spreadsheet!');
          return true;
        }
        return false;
      } catch (err) {
        state.spreadsheetStatus.error = String(err);
        if (!silent) showToast('Gagal menyinkronkan dengan Spreadsheet, menggunakan penyimpanan lokal.', 'warning');
        return false;
      } finally {
        if (!silent) setGlobalLoading(false);
      }
    }

    async function saveRecordUnified(table, id, data) {
      const recordId = id || `${table}_${Date.now()}_${Math.floor(Math.random() * 9000)}`;
      const record = { ...data, id: recordId };

      if (table === 'teachers') {
        const idx = state.teachers.findIndex((t) => t.id === recordId);
        if (idx >= 0) state.teachers[idx] = { ...state.teachers[idx], ...record };
        else state.teachers.push(record);
      } else if (table === 'tps') {
        const idx = state.tps.findIndex((t) => t.id === recordId);
        if (idx >= 0) state.tps[idx] = { ...state.tps[idx], ...record };
        else state.tps.push(record);
      } else if (table === 'blueprints') {
        const idx = state.blueprints.findIndex((b) => b.id === recordId);
        if (idx >= 0) state.blueprints[idx] = { ...state.blueprints[idx], ...record };
        else state.blueprints.push(record);
      } else if (table === 'questions') {
        const normQ = normalizeQuestionRecord(record);
        const idx = state.questions.findIndex((q) => q.id === recordId);
        if (idx >= 0) state.questions[idx] = normQ;
        else state.questions.push(normQ);
      } else if (table === 'sessions') {
        const idx = state.sessions.findIndex((s) => s.id === recordId);
        const rawList = [...state.sessions];
        if (idx >= 0) rawList[idx] = { ...rawList[idx], ...record };
        else rawList.push(record);
        state.sessions = deduplicateSessionsList(rawList);
      } else if (table === 'registrations') {
        const idx = state.teacherRegistrations.findIndex((r) => r.id === recordId);
        if (idx >= 0) state.teacherRegistrations[idx] = { ...state.teacherRegistrations[idx], ...record };
        else state.teacherRegistrations.push(record);
      }

      saveLocalBackupDb();
      await postToSpreadsheet({ action: 'upsert', table, data: record });
      return recordId;
    }

    async function deleteRecordUnified(table, id) {
      if (table === 'teachers') {
        state.teachers = state.teachers.filter((t) => t.id !== id);
      } else if (table === 'tps') {
        state.tps = state.tps.filter((t) => t.id !== id);
      } else if (table === 'blueprints') {
        state.blueprints = state.blueprints.filter((b) => b.id !== id);
      } else if (table === 'questions') {
        state.questions = state.questions.filter((q) => q.id !== id);
      } else if (table === 'sessions') {
        state.sessions = state.sessions.filter((s) => s.id !== id);
      } else if (table === 'registrations') {
        state.teacherRegistrations = state.teacherRegistrations.filter((r) => r.id !== id);
      }

      saveLocalBackupDb();
      await postToSpreadsheet({ action: 'delete', table, id });
      renderApp();
      showToast('Data berhasil dihapus.');
    }

    function renderDonutChartSvg(title, centerText, segments) {
      const total = segments.reduce((acc, s) => acc + (Number(s.value) || 0), 0);
      const radius = 56;
      const circumference = 2 * Math.PI * radius;
      let offset = 0;

      const circlesHtml =
        total === 0
          ? `<circle cx="110" cy="95" r="${radius}" fill="none" stroke="#e2e8f0" stroke-width="18" />`
          : segments
              .map((seg) => {
                const val = Number(seg.value) || 0;
                const dash = (val / total) * circumference;
                const circle = `<circle cx="110" cy="95" r="${radius}" fill="none" stroke="${seg.color}" stroke-width="18" stroke-dasharray="${dash} ${circumference}" stroke-dashoffset="${-offset}" transform="rotate(-90 110 95)" />`;
                offset += dash;
                return circle;
              })
              .join('');

      const legendHtml = segments
        .map(
          (seg) => `
          <div class="flex items-center justify-between text-xs">
            <span class="flex items-center gap-2 text-slate-600">
              <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color:${seg.color}"></span>
              <span>${escapeHtml(seg.label)}</span>
            </span>
            <span class="font-extrabold text-slate-800">${Number(seg.value) || 0}</span>
          </div>
        `
        )
        .join('');

      return `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
          <h4 class="text-sm font-extrabold text-slate-800 mb-3">${escapeHtml(title)}</h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center">
            <svg viewBox="0 0 220 190" class="w-full max-w-[200px] mx-auto">
              ${circlesHtml}
              <text x="110" y="98" text-anchor="middle" class="fill-slate-800 font-extrabold text-sm">${escapeHtml(centerText)}</text>
            </svg>
            <div class="space-y-2.5">${legendHtml}</div>
          </div>
        </div>
      `;
    }

    async function handleSubmitTeacherRegistration(e) {
      e.preventDefault();
      const f = state.teacherRegisterForm;
      const schoolName = String(f.schoolName || '').trim();
      const teacherName = String(f.teacherName || '').trim();
      const subject = String(f.subject || '').trim();
      const username = String(f.username || '').trim().toLowerCase();
      const password = String(f.password || '').trim();

      if (!schoolName || !teacherName || !subject || !username || !password) {
        f.error = 'Semua kolom (Nama Sekolah, Nama Guru, Mata Pelajaran, Username, dan Password) wajib diisi.';
        renderApp();
        return;
      }

      const usedInTeachers = state.teachers.some(
        (t) => String(t.username || '').trim().toLowerCase() === username
      );
      const usedInPending = (state.teacherRegistrations || []).some(
        (r) => String(r.username || '').trim().toLowerCase() === username
      );
      if (usedInTeachers || usedInPending) {
        f.error = `Username "${username}" sudah terdaftar atau sedang menunggu aktivasi. Gunakan username lain.`;
        renderApp();
        return;
      }

      f.error = '';
      await runWithSavingAnimation(
        'Mengirim data pendaftaran guru...',
        async () => {
          await saveRecordUnified('registrations', null, {
            schoolName,
            teacherName,
            subject,
            username,
            password,
            status: 'menunggu_aktivasi',
            createdAt: new Date().toISOString(),
          });
          state.teacherRegisterForm = {
            schoolName: '',
            teacherName: '',
            subject: '',
            username: '',
            password: '',
            showPass: false,
            error: '',
            successMessage:
              'Data pendaftaran berhasil dikirim! Silakan hubungi Proktor Utama untuk aktivasi manual akun Anda.',
          };
        },
        'Data pendaftaran guru berhasil disimpan!'
      );
      renderApp();
    }

    function handleTokenLiveInput(val) {
      const token = String(val || '').trim().toUpperCase();
      state.loginForm.studentToken = token;
      const previewEl = document.getElementById('token-live-preview');
      if (!previewEl) return;

      if (token.length < 3) {
        previewEl.innerHTML = '';
        return;
      }

      const matchedTeacher = state.teachers.find(
        (t) => String(t.token || '').trim().toUpperCase() === token
      );
      if (matchedTeacher) {
        const isOpen = matchedTeacher.examOpen !== false;
        previewEl.innerHTML = `
          <div class="mt-2 px-3 py-2 rounded-lg text-xs flex items-center justify-between gap-2 ${
            isOpen
              ? 'bg-emerald-50 border border-emerald-200 text-emerald-800'
              : 'bg-rose-50 border border-rose-200 text-rose-800'
          }">
            <span class="font-bold truncate">✓ ${escapeHtml(matchedTeacher.subject)} (${escapeHtml(matchedTeacher.name)})</span>
            <span class="font-extrabold shrink-0">${isOpen ? 'DIBUKA' : 'DITUTUP'}</span>
          </div>
        `;
      } else if (token.length >= 6) {
        previewEl.innerHTML = `
          <div class="mt-2 px-3 py-1.5 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-[11px] font-semibold">
            Token belum ditemukan pada paket ujian aktif.
          </div>
        `;
      } else {
        previewEl.innerHTML = '';
      }
    }

    async function handleStudentLogin(e) {
      e.preventDefault();
      if (state.isLoggingInStudent) return;

      const name = String(state.loginForm.studentName || '').trim();
      const nisn = String(state.loginForm.studentNisn || '').trim();
      const studentClass = String(state.loginForm.studentClass || '').trim().toUpperCase();
      const token = String(state.loginForm.studentToken || '').trim().toUpperCase();

      if (!name || !nisn || !studentClass || !token) {
        state.loginForm.studentError =
          'Nama Lengkap, NISN/Username, Kelas, dan Token Ujian wajib diisi.';
        renderApp();
        return;
      }

      state.loginForm.studentError = '';
      state.isLoggingInStudent = true;
      renderApp();

      try {
        if (isSpreadsheetMode()) {
          await fetchFromSpreadsheet(state.spreadsheetApiUrl, true);
        }

        const teacher = state.teachers.find(
          (t) => String(t.token || '').trim().toUpperCase() === token
        );
        if (!teacher) {
          state.loginForm.studentError =
            'Token Ujian tidak valid atau tidak ditemukan. Periksa kembali kode token dari guru Anda.';
          return;
        }

        if (teacher.examOpen === false) {
          state.loginForm.studentError = `Sesi ujian untuk mata pelajaran ${teacher.subject} sedang ditutup oleh Guru / Proktor.`;
          return;
        }

        const existingSession = state.sessions.find(
          (s) =>
            String(s.nisn || '').trim().toLowerCase() === nisn.toLowerCase() &&
            String(s.teacherId || '').trim().toLowerCase() === String(teacher.id || '').trim().toLowerCase()
        );

        if (existingSession && existingSession.status === 'selesai') {
          state.loginForm.studentError =
            'NISN Anda sudah tercatat menyelesaikan tes untuk mata pelajaran ini. Hubungi Proktor apabila memerlukan reset ujian.';
          return;
        }

        const teacherQuestions = state.questions
          .filter((q) => isOwnedByTeacher(q, teacher))
          .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));

        if (teacherQuestions.length === 0) {
          state.loginForm.studentError = `Belum ada butir soal yang siap diujikan untuk mata pelajaran ${teacher.subject}.`;
          return;
        }

        const maxQuestions = Math.max(
          1,
          Number(teacher.targetQuestionCount) || teacherQuestions.length
        );
        const selectedQuestions = teacherQuestions.slice(0, maxQuestions);

        state.studentSession = {
          profile: { name, nisn, studentClass, token },
          teacher,
          integrityAgreed: false,
          activeSessionId: existingSession ? existingSession.id : null,
          questions: selectedQuestions,
          currentQIndex: 0,
          answers:
            existingSession?.answers && typeof existingSession.answers === 'object'
              ? { ...existingSession.answers }
              : {},
          doubtFlags: {},
          fontScale: 'base',
          remainingSeconds: Math.max(1, Number(teacher.durationMinutes) || 60) * 60,
          resultSummary: null,
          violationCount: 0,
          maxViolations: 3,
          violationWarningModal: null,
          lastViolationTimestamp: 0,
          isEnteringFullscreen: false,
          hasEnteredFullscreen: false,
          isViolationAutoFinished: false,
        };
        state.currentView = 'student_confirm';
      } finally {
        state.isLoggingInStudent = false;
        renderApp();
      }
    }

    const PROKTOR_FALLBACK_PASS_HASH = 'bd97757cc19a5d679cbd15dd24306d51a76cb67767eebc34859f09d4a45fb7d7';

    async function sha256Hex(text) {
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(String(text || ''));
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer))
          .map((b) => b.toString(16).padStart(2, '0'))
          .join('');
      } catch {
        return '';
      }
    }

    async function handleProktorLogin(e) {
      e.preventDefault();
      const userInput = String(state.loginForm.proktorUser || '').trim().toLowerCase();
      const passInput = String(state.loginForm.proktorPass || '').trim();

      if (!userInput || !passInput) {
        state.loginForm.proktorError = 'Username dan password wajib diisi.';
        renderApp();
        return;
      }

      if (state.teachers.length === 0 && isSpreadsheetMode()) {
        await fetchFromSpreadsheet(state.spreadsheetApiUrl, true);
      }

      let matched = state.teachers.find(
        (t) =>
          String(t.username || '').trim().toLowerCase() === userInput &&
          String(t.password || '').trim() === passInput
      );

      if (!matched) {
        const [uHash, pHash] = await Promise.all([sha256Hex(userInput), sha256Hex(passInput)]);
        if (uHash === PROKTOR_FALLBACK_USER_HASH && pHash === PROKTOR_FALLBACK_PASS_HASH) {
          matched = {
            id: 'teacher_proktor_1',
            name: 'Proktor Utama TKA',
            subject: 'Administrator & Proktor Utama',
            username: userInput,
            password: passInput,
            token: 'ADM206',
            role: 'proktor',
            proktorCode: 'P-ADM206-26',
            durationMinutes: 60,
            targetQuestionCount: 5,
            examOpen: true,
            createdAt: '2026-01-10T08:00:00.000Z',
          };
          state.teachers.unshift(matched);
          saveLocalBackupDb();
        }
      }

      if (!matched) {
        const pendingReg = (state.teacherRegistrations || []).find(
          (r) => String(r.username || '').trim().toLowerCase() === userInput
        );
        state.loginForm.proktorError = pendingReg
          ? 'Pendaftaran akun Anda masih menunggu aktivasi oleh Proktor Utama. Silakan hubungi Proktor Utama.'
          : 'Username atau password tidak sesuai. Periksa kembali akun Anda.';
        renderApp();
        return;
      }

      state.loginForm.proktorError = '';
      state.activeTeacherId = matched.id;
      state.proktorTab = 'beranda';
      state.mobileMenuOpen = false;

      if (matched.role === 'guru') {
        state.selectedWorkspaceTeacherId = matched.id;
      } else if (
        !state.selectedWorkspaceTeacherId ||
        !state.teachers.some((t) => t.id === state.selectedWorkspaceTeacherId)
      ) {
        const firstGuru = state.teachers.find((t) => t.role === 'guru');
        state.selectedWorkspaceTeacherId = firstGuru ? firstGuru.id : matched.id;

      const ws = getWorkspaceTeacher() || matched;
      state.examDurationInput = Number(ws.durationMinutes) || 60;
      const wsQCount = state.questions.filter((q) => isOwnedByTeacher(q, ws)).length;
      state.examQuestionCountInput =
        wsQCount > 0
          ? Math.min(wsQCount, Number(ws.targetQuestionCount) || wsQCount)
          : Number(ws.targetQuestionCount) || 5;

      state.currentView = 'proktor';
      renderApp();
      showToast(`Selamat datang, ${matched.name}!`, 'success', 'Login Berhasil');

    function isTouchMobileOrTabletDevice() {

        const uaMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(

      } catch {

    }

        if (el && el.requestFullscreen && !document.fullscreenElement) {
          ss.isEnteringFullscreen = true;
          await el.requestFullscreen();
          ss.hasEnteredFullscreen = true;
        } else if (isTouchMobileOrTabletDevice()) {
          ss.hasEnteredFullscreen = false;
        }
      } catch {

      const ss = state.studentSession;
      if (state.currentView !== 'student_exam' || state.isSubmittingExam || ss.isViolationAutoFinished) {

      }

      const now = Date.now();
      if (now - (ss.lastViolationTimestamp || 0) < 1500) return;
      ss.lastViolationTimestamp = now;

      const nextCount = (Number(ss.violationCount) || 0) + 1;
      const maxV = Number(ss.maxViolations) || 3;
      ss.violationCount = nextCount;

      if (nextCount >= maxV) {

      ss.violationWarningModal = {

        max: maxV,
        reason: reason || 'Meninggalkan layar ujian',

      renderApp();
    }

    function isQuestionAnswered(q) {
      if (!q) return false;
      const ans = state.studentSession.answers[q.id];
      if (q.type === 'PG') {
        return typeof ans === 'number' && ans >= 0;
      }
      if (q.type === 'PG_KOMPLEKS') {
        return Array.isArray(ans) && ans.length > 0;
      }
      if (q.type === 'BENAR_SALAH') {
        if (!ans || typeof ans !== 'object') return false;
        const totalStmts = Array.isArray(q.options) ? q.options.length : 0;
        if (totalStmts === 0) return false;
        for (let i = 0; i < totalStmts; i++) {
          if (typeof ans[i] !== 'boolean') return false;
        }
        return true;
      }
      return false;
    }

    function togglePgKompleksOption(qId, optIdx) {
      const prev = Array.isArray(state.studentSession.answers[qId])
        ? [...state.studentSession.answers[qId]]

      const existsIdx = prev.indexOf(optIdx);
      if (existsIdx >= 0) prev.splice(existsIdx, 1);

      state.studentSession.answers[qId] = prev.sort((a, b) => a - b);

      const ss = state.studentSession;
      const totalQ = ss.questions.length;
      const answeredCount = ss.questions.filter(isQuestionAnswered).length;
      const unansweredCount = totalQ - answeredCount;
      const doubtCount = ss.questions.filter((q) => ss.doubtFlags[q.id]).length;

      const warningParts = [];
      if (unansweredCount > 0) warningParts.push(`${unansweredCount} soal belum dijawab`);
      if (doubtCount > 0) warningParts.push(`${doubtCount} soal masih ditandai ragu-ragu`);

      const extraNote =
        warningParts.length > 0
          ? ` Perhatian: Masih terdapat ${warningParts.join(' dan ')}.`
          : ' Seluruh soal telah terjawab dengan lengkap.';

      openConfirmModal({
        title: 'Kumpulkan & Akhiri Tes TKA?',
        message: `Anda telah menjawab ${answeredCount} dari ${totalQ} butir soal.${extraNote} Setelah dikumpulkan, jawaban tidak dapat diubah kembali.`,
        confirmText: 'Ya, Kumpulkan Jawaban',

    async function handleFinishExam(isAutoTimeout = false, isViolationAutoFinish = false) {
      const ss = state.studentSession;
      if (!ss.profile || !ss.teacher || ss.questions.length === 0 || state.isSubmittingExam) return;

      state.isSubmittingExam = true;
      ss.violationWarningModal = null;
      exitExamFullscreen();
      renderApp();

      try {
        let totalWeight = 0;
        let earnedWeight = 0;
        const tpAccumulator = {};

        ss.questions.forEach((q) => {
          const w = Number(q.weight) || 20;
          totalWeight += w;
          const ans = ss.answers[q.id];
          let ratio = 0;

          if (q.type === 'PG') {
            if (typeof ans === 'number' && ans === Number(q.correctAnswer)) {
              ratio = 1;
            }
          } else if (q.type === 'PG_KOMPLEKS') {
            const correctSet = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
            const userSet = Array.isArray(ans) ? ans : [];
            if (correctSet.length > 0 && userSet.length > 0) {
              let hits = 0;
              let wrongPicks = 0;
              userSet.forEach((pick) => {
                if (correctSet.includes(pick)) hits += 1;
                else wrongPicks += 1;
              });
              ratio = Math.max(0, (hits - wrongPicks * 0.5) / correctSet.length);
            }
          } else if (q.type === 'BENAR_SALAH') {
            const correctArr = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
            const userObj = ans && typeof ans === 'object' ? ans : {};
            if (correctArr.length > 0) {
              let matches = 0;
              correctArr.forEach((expectedBool, idx) => {
                if (userObj[idx] === expectedBool) matches += 1;
              });
              ratio = matches / correctArr.length;
            }
          }

          const earned = w * ratio;
          earnedWeight += earned;

          const tpKey = q.tpCode || 'TP.1';
          if (!tpAccumulator[tpKey]) {
            const tpMeta = state.tps.find(
              (t) => isOwnedByTeacher(t, ss.teacher) && (t.id === q.tpId || t.code === tpKey)
            );
            tpAccumulator[tpKey] = {
              tpCode: tpKey,
              description: tpMeta?.description || `Capaian Pembelajaran ${tpKey}`,
              kktp: Number(tpMeta?.kktp) || 75,
              totalW: 0,
              earnedW: 0,
            };
          }
          tpAccumulator[tpKey].totalW += w;
          tpAccumulator[tpKey].earnedW += earned;
        });

        const finalScore = totalWeight > 0 ? Math.round((earnedWeight / totalWeight) * 100) : 0;
        const tpBreakdown = Object.values(tpAccumulator).map((item) => {
          const tpScore = item.totalW > 0 ? Math.round((item.earnedW / item.totalW) * 100) : 0;
          return {
            tpCode: item.tpCode,
            description: item.description,
            kktp: item.kktp,
            score: tpScore,
            passed: tpScore >= item.kktp,
          };
        });

        const avgKktp =
          tpBreakdown.length > 0
            ? Math.round(tpBreakdown.reduce((a, b) => a + b.kktp, 0) / tpBreakdown.length)
            : 75;
        const overallPassed = finalScore >= avgKktp;

        const existingSession = state.sessions.find(
          (s) =>
            (ss.activeSessionId && s.id === ss.activeSessionId) ||
            (String(s.nisn || '').trim().toLowerCase() === String(ss.profile.nisn).trim().toLowerCase() &&
              String(s.teacherId || '').trim().toLowerCase() === String(ss.teacher.id).trim().toLowerCase())
        );

        await saveRecordUnified('sessions', existingSession ? existingSession.id : ss.activeSessionId, {
          studentName: ss.profile.name,
          nisn: ss.profile.nisn,
          studentClass: ss.profile.studentClass,
          teacherId: ss.teacher.id,
          teacherName: ss.teacher.name,
          subject: ss.teacher.subject,
          tokenUsed: ss.profile.token,
          status: 'selesai',
          startedAt: existingSession?.startedAt || new Date().toISOString(),
          finishedAt: new Date().toISOString(),
          score: finalScore,
          passed: overallPassed,
          tpBreakdownJson: JSON.stringify(tpBreakdown),
          answersJson: JSON.stringify(ss.answers),
        });

        ss.isViolationAutoFinished = Boolean(isViolationAutoFinish);
        ss.resultSummary = {
          score: finalScore,
          passed: overallPassed,
          tpBreakdown,
        };
        state.currentView = 'student_result';
        if (isViolationAutoFinish) {
          showToast(
            'Batas pelanggaran keamanan tercapai (3/3). Sistem otomatis mengakhiri tes dan mengirimkan jawaban Anda.',
            'error',
            'Tes Diakhiri Otomatis'
          );
        } else if (isAutoTimeout) {
          showToast('Waktu pengerjaan telah habis. Jawaban Anda otomatis dikumpulkan.', 'warning', 'Waktu Habis');
        }
      } finally {
        state.isSubmittingExam = false;
        renderApp();
      }
    }

      const ws = getWorkspaceTeacher();
      if (!ws) return;

      const availableQuestions = state.questions.filter((q) => isOwnedByTeacher(q, ws)).length;
      const durationMinutes = Math.max(5, Math.min(240, Number(state.examDurationInput) || 60));
      const rawTargetCount = Math.max(1, Math.min(100, Number(state.examQuestionCountInput) || 5));

      if (!toggleOpen && availableQuestions > 0 && rawTargetCount > availableQuestions) {
        showToast(
          `Jumlah butir soal ditampilkan (${rawTargetCount}) melebihi ketersediaan Bank Soal saat ini (${availableQuestions} butir). Masukkan maksimal ${availableQuestions} soal.`,
          'error',
          'Validasi Jumlah Soal'
        );
        return;
      }

      const targetQuestionCount =
        availableQuestions > 0 ? Math.min(rawTargetCount, availableQuestions) : rawTargetCount;
      state.examQuestionCountInput = targetQuestionCount;
      const nextExamOpen = toggleOpen ? !(ws.examOpen !== false) : ws.examOpen !== false;

      await runWithSavingAnimation(
        'Menyimpan pengaturan ujian...',

8. SEBARAN KUNCI JAWABAN: Acak posisi kunci jawaban sehingga tersebar merata.`;

      const responseSchema = {

      let generatedItems = [];
      const usedTopicsSummary = [];
      let fallbackCountUsed = 0;

        const remaining = targetCount - generatedItems.length;

        const batchNumber = Math.floor(generatedItems.length / BATCH_SIZE) + 1;

                deepLearningPhase: raw.deepLearningPhase || selectedDeepPhase,
                graduateDimension: raw.graduateDimension || selectedGradDim,

          questionType: item.questionType,

        state.blueprints.push(bpRecord);

          correctAnswer =

            item.correctPgIndex >= 0 &&

              ? item.correctPgIndex
              : 0;
        } else if (item.questionType === 'PG_KOMPLEKS') {
          const validMulti = Array.isArray(item.correctMultiIndices)
            ? item.correctMultiIndices.filter((idx) => idx >= 0 && idx < item.options.length)
            : [];
          correctAnswer = validMulti.length > 0 ? validMulti : [0, 1];
        } else {
          const validBs = Array.isArray(item.correctBsBooleans)
            ? item.correctBsBooleans.slice(0, item.options.length).map(Boolean)
            : [];
          while (validBs.length < item.options.length) {
            validBs.push(validBs.length % 2 === 0);
          }
          correctAnswer = validBs;
        }

        const localAudit = runLocalTkaAuditHeuristic({
          subject: teacher.subject,

          tpDesc: tpRecord.description,

          order: nextQOrder++,
          analysisJson: JSON.stringify(localAudit),
          createdAt: new Date().toISOString(),
        };

        state.questions.push(normalizeQuestionRecord(rawQuestionRecord));
        batchPayloadItems.push({ table: 'questions', data: rawQuestionRecord });
      }

      // Selaraskan otomatis kuota targetQuestionCount pada profil guru dengan total soal terkini
      const updatedTotalQuestions = state.questions.filter((q) => isOwnedByTeacher(q, teacher)).length;
      const teacherIdx = state.teachers.findIndex((t) => t.id === teacher.id);
      if (teacherIdx >= 0) {
        const updatedTeacherRecord = {
          ...state.teachers[teacherIdx],
          targetQuestionCount: updatedTotalQuestions,
        };
        state.teachers[teacherIdx] = updatedTeacherRecord;
        batchPayloadItems.push({ table: 'teachers', data: updatedTeacherRecord });
      }
      if (getWorkspaceTeacher()?.id === teacher.id) {
        state.examQuestionCountInput = updatedTotalQuestions;
      }

      saveLocalBackupDb();
      await postToSpreadsheet({ action: 'batchUpsert', items: batchPayloadItems });
      return generatedItems.length;
    }

    function runLocalTkaAuditHeuristic({ subject, tpCode, tpDesc, type, questionText, options }) {
      const qClean = String(questionText || '').trim();
      const qLower = qClean.toLowerCase();
      const cleanOpts = (options || []).map((o) => String(o || '').trim()).filter((o) => o !== '');
      const balanceInfo = evaluateOptionBalance(cleanOpts);

      let score = 100;
      const materiNotes = [];
      const konstruksiNotes = [];
      const bahasaNotes = [];
      const fixActions = [];

      const hasStimulus = qClean.length >= 110 && (qClean.includes('\n') || qClean.includes(':') || /\d/.test(qClean));
      const tpSnippet = String(tpDesc || '').trim().toLowerCase().slice(0, 38);
      const hasRawTpPaste = tpSnippet.length >= 20 && qLower.includes(tpSnippet);
      const isGenericBoilerplate =
        /dalam sebuah proyek evaluasi lapangan.*memenuhi standar capaian minimal/i.test(qClean) ||
        /dalam konteks pencapaian kompetensi.*pada mata pelajaran/i.test(qClean);

      if (hasRawTpPaste) {
        score -= 22;
        materiNotes.push('Terdeteksi salinan teks deskripsi TP mentah di dalam pokok soal; ganti dengan studi kasus nyata.');
        fixActions.push('Hapus kutipan deskripsi TP mentah dan ganti dengan stimulus studi kasus/data spesifik.');
      }
      if (isGenericBoilerplate) {
        score -= 25;
        materiNotes.push('Pokok soal terdeteksi menggunakan pola kalimat generik yang kurang spesifik pada konten materi.');
        fixActions.push('Rumuskan stimulus kasus spesifik mata pelajaran ' + subject + '.');
      }
      if (!hasStimulus) {
        score -= 18;
        materiNotes.push(`Stimulus kontekstual pada ${tpCode} masih terlalu singkat sehingga belum mendorong penalaran tingkat tinggi (L2/L3).`);
        fixActions.push('Tambahkan pengantar kasus, data numerik, atau kutipan teks yang fungsional.');
      } else if (!hasRawTpPaste && !isGenericBoilerplate) {
        materiNotes.push(`Selaras dengan ${tpCode} pada ${subject} serta memuat stimulus kontekstual yang fungsional.`);
      }

      const isRecallOnly =
        /^(apa pengertian|definisi dari|sebutkan pengertian|kepanjangan dari|siapa penemu)/i.test(qClean) &&
        !hasStimulus;
      let cognitiveLevel = hasStimulus ? 'L3 - Penalaran (C4)' : 'L2 - Aplikasi (C3)';
      if (isRecallOnly) {
        cognitiveLevel = 'L1 - Pemahaman/Hafalan (C1–C2)';
        score -= 16;
        materiNotes.push('Soal cenderung mengukur hafalan definisi (L1), belum memenuhi standar penalaran TKA.');
        fixActions.push('Ubah pertanyaan menjadi analisis kasus atau pemecahan masalah (L2/L3).');
      }

      const minRequiredOpts = type === 'BENAR_SALAH' ? 3 : type === 'PG_KOMPLEKS' ? 4 : 5;
      if (cleanOpts.length < minRequiredOpts) {
        score -= 12;
        konstruksiNotes.push(`Jumlah opsi/pernyataan (${cleanOpts.length}) kurang dari standar ideal (${minRequiredOpts} butir).`);
        fixActions.push(`Lengkapi menjadi ${minRequiredOpts} opsi/pernyataan yang homogen.`);
      }

      const weakDistractorPattern =
        /(mengabaikan data|menunda verifikasi|semua jawaban benar|semua jawaban salah|tidak ada jawaban yang benar)/i;
      const hasWeakDistractor = cleanOpts.some((opt) => weakDistractorPattern.test(opt));
      if (hasWeakDistractor) {
        score -= 15;
        konstruksiNotes.push('Terdapat pengecoh bernada negatif ekstrem atau klise ("semua benar/salah") yang mudah ditebak siswa.');
        fixActions.push('Ganti pengecoh ekstrem dengan pengecoh rasional berbasis miskonsepsi konsep.');
      }

      if (type !== 'BENAR_SALAH' && !balanceInfo.isBalanced) {
        score -= 14;
        konstruksiNotes.push(
          `Panjang teks antar opsi tidak seimbang (selisih ${balanceInfo.maxVariancePercent}%, melebihi batas maksimal 15%).`
        );
        fixActions.push('Setarakan panjang kalimat dan tingkat rincian antara kunci jawaban dan seluruh pengecoh (selisih <= 15%).');
      } else if (!hasWeakDistractor && cleanOpts.length >= minRequiredOpts) {
        konstruksiNotes.push(
          `Konstruksi soal valid, struktur kalimat paralel, dan panjang opsi seimbang (selisih ${balanceInfo.maxVariancePercent}% <= 15%).`
        );
      }

      const nonStandardWords = ['analisa', 'aktifitas', 'resiko', 'praktek', 'tehnik', 'sistim', 'mensosialisasikan', 'meminimalisir', 'mensukseskan'];
      const foundNonStandard = nonStandardWords.filter((w) => new RegExp(`\\b${w}\\b`, 'i').test(qClean + ' ' + cleanOpts.join(' ')));
      if (foundNonStandard.length > 0) {
        score -= 10;
        bahasaNotes.push(`Ditemukan kata tidak baku menurut EYD V (${foundNonStandard.join(', ')}).`);
        fixActions.push(`Perbaiki kata tidak baku (${foundNonStandard.join(', ')}) sesuai KBBI & EYD V.`);
      } else {
        bahasaNotes.push('Menggunakan bahasa Indonesia baku sesuai kaidah EYD Edisi V, lugas, dan bebas bias.');
      }

      const finalScore = Math.max(40, Math.min(98, score));
      const status =
        finalScore >= 85
          ? 'Layak Digunakan (Valid TKA)'
          : finalScore >= 70
          ? 'Layak dengan Catatan Revisi'
          : 'Perlu Revisi Substansial (Belum Memenuhi Syarat TKA)';

      return {
        cognitiveLevel,
        feasibilityScore: finalScore,
        status,
        materiCheck: materiNotes.join(' '),
        konstruksiCheck: konstruksiNotes.join(' '),
        bahasaCheck: bahasaNotes.join(' '),
        recommendation:
          fixActions.length === 0
            ? 'Butir soal memenuhi standar Perka BSKAP No. 45 & 47/2025 dan siap diujikan.'
            : 'Saran perbaikan: ' + fixActions.join(' '),
      };
    }

    async function runTkaQualityAnalysis({ subject, tpCode, tpDesc, type, questionText, options }) {
      const cleanOpts = (options || []).filter((o) => String(o).trim() !== '');
      const localAudit = runLocalTkaAuditHeuristic({
        subject,
        tpCode,
        tpDesc,
        type,
        questionText,
        options: cleanOpts,
      });

      const sysPrompt = `Anda adalah penelaah kritis butir soal Tes Kemampuan Akademik (TKA) Pusmendik Kemendikdasmen RI berdasarkan Permendikdasmen No. 9/2025 dan Perka BSKAP No. 45 & 47/2025.
Berikan penilaian OBJEKTIF dan KRITIS:
- Turunkan skor kelayakan secara tegas (di bawah 75%) jika soal bersifat generik, menyalin teks TP mentah, tidak memiliki stimulus fungsional, hanya mengukur hafalan (L1), memiliki pengecoh lemah/ekstrem, atau selisih panjang opsi > 15%.
- Berikan skor >= 85% HANYA jika stimulus autentik, level kognitif L2/L3, pengecoh homogen berbasis miskonsepsi, panjang opsi seragam (<= 15%), dan bahasa sesuai EYD V.`;

      const usrPrompt = `Telaah secara kritis butir soal TKA berikut:
- Mata Pelajaran: ${subject}
- Tujuan Pembelajaran (${tpCode}): ${tpDesc}
- Bentuk Soal: ${type}
- Pertanyaan / Stimulus: ${questionText}
- Pilihan / Pernyataan: ${cleanOpts.join(' | ')}`;

      const schema = {
        type: 'OBJECT',
        properties: {
          cognitiveLevel: { type: 'STRING' },
          feasibilityScore: { type: 'INTEGER' },
          status: { type: 'STRING' },
          materiCheck: { type: 'STRING' },
          konstruksiCheck: { type: 'STRING' },
          bahasaCheck: { type: 'STRING' },
          recommendation: { type: 'STRING' },
        },
        required: [
          'cognitiveLevel',
          'feasibilityScore',
          'status',
          'materiCheck',
          'konstruksiCheck',
          'bahasaCheck',
          'recommendation',
        ],
      };

      try {
        const aiAudit = await callGeminiTkaJson(sysPrompt, usrPrompt, schema);
        const boundedScore = Math.min(Number(aiAudit.feasibilityScore) || localAudit.feasibilityScore, localAudit.feasibilityScore);
        return {
          ...aiAudit,
          feasibilityScore: boundedScore,
          status:
            boundedScore >= 85
              ? 'Layak Digunakan (Valid TKA)'
              : boundedScore >= 70
              ? 'Layak dengan Catatan Revisi'
              : 'Perlu Revisi Substansial (Belum Memenuhi Syarat TKA)',
        };
      } catch {
        return localAudit;
      }
    }

    function handleEditQuestion(qId) {

      let correctMulti = [0];

      if (q.type === 'BENAR_SALAH') {
        statements = Array.isArray(q.options) && q.options.length > 0 ? [...q.options] : ['', '', ''];

          Array.isArray(q.correctAnswer) && q.correctAnswer.length === statements.length
            ? [...q.correctAnswer]
            : statements.map(() => true);
      } else {
        options = Array.isArray(q.options) ? [...q.options] : ['', '', '', '', ''];
        while (options.length < 5) options.push('');
        if (q.type === 'PG_KOMPLEKS') {
          correctMulti = Array.isArray(q.correctAnswer) ? [...q.correctAnswer] : [0];
        } else {
          correctPg = typeof q.correctAnswer === 'number' ? q.correctAnswer : 0;
        }
      }

      state.qForm = {
        editingId: q.id,
        tpId: q.tpId || '',

        text: q.questionText || '',

        correctPg,

    async function handleSaveQuestion(e) {
      e.preventDefault();
      const ws = getWorkspaceTeacher();
      if (!ws) return;
      if (!state.qForm.text.trim()) {
        showToast('Teks pertanyaan soal wajib diisi.', 'error', 'Data Belum Lengkap');
        return;
      }

      const wsTps = state.tps.filter((t) => isOwnedByTeacher(t, ws));
      const selectedTp = wsTps.find((t) => t.id === state.qForm.tpId) || wsTps[0];
      const tpCode = selectedTp ? selectedTp.code : 'TP.1';

      let finalOptions = [];
      let finalCorrect = null;

      if (state.qForm.type === 'BENAR_SALAH') {
        const validPairs = state.qForm.statements
          .map((st, idx) => ({ st: st.trim(), ans: Boolean(state.qForm.correctBs[idx]) }))
          .filter((item) => item.st !== '');
        if (validPairs.length === 0) {
          showToast('Isi minimal 1 pernyataan untuk soal Benar/Salah.', 'error', 'Data Belum Lengkap');
          return;
        }
        finalOptions = validPairs.map((p) => p.st);
        finalCorrect = validPairs.map((p) => p.ans);
      } else {
        const trimmedOpts = state.qForm.options.map((o) => o.trim()).filter((o) => o !== '');
        if (trimmedOpts.length < 2) {
          showToast('Isi minimal 2 pilihan jawaban.', 'error', 'Data Belum Lengkap');
          return;
        }
        finalOptions = trimmedOpts;

        if (state.qForm.type === 'PG') {
          if (state.qForm.correctPg >= finalOptions.length) {
            showToast('Pilih kunci jawaban pada opsi yang terisi.', 'error', 'Kunci Belum Dipilih');
            return;
          }
          finalCorrect = state.qForm.correctPg;
        } else {
          const validMulti = state.qForm.correctMulti.filter((idx) => idx < finalOptions.length);
          if (validMulti.length === 0) {
            showToast('Pilih minimal 1 kunci jawaban untuk Pilihan Ganda Kompleks.', 'error', 'Kunci Belum Dipilih');
            return;
          }
          finalCorrect = validMulti.sort((a, b) => a - b);
        }
      }

      const wasEditingQ = Boolean(state.qForm.editingId);
      const existingQ = wasEditingQ ? state.questions.find((q) => q.id === state.qForm.editingId) : null;

      await runWithSavingAnimation(
        wasEditingQ
          ? 'Menyimpan perubahan & menganalisis kelayakan soal TKA...'
          : 'Menyimpan butir soal & menjalankan analisis syarat TKA...',
        async () => {
          const analysisResult =
            state.qForm.analysisPreview ||
            (await runTkaQualityAnalysis({
              subject: ws.subject,
              tpCode,
              tpDesc: selectedTp?.description || 'Tujuan Pembelajaran Terkait',
              type: state.qForm.type,
              questionText: state.qForm.text.trim(),
              options: finalOptions,
            }));

          await saveRecordUnified('questions', state.qForm.editingId, {
            teacherId: ws.id,
            teacherToken: ws.token,
            tpId: selectedTp ? selectedTp.id : '',
            tpCode,
            type: state.qForm.type,
            questionText: state.qForm.text.trim(),
            optionsJson: JSON.stringify(finalOptions),
            correctAnswerJson: JSON.stringify(finalCorrect),
            weight: Number(state.qForm.weight) || 20,
            order: existingQ?.order || getNextQuestionOrder(ws),
            analysisJson: JSON.stringify(analysisResult),
            createdAt: existingQ?.createdAt || new Date().toISOString(),
          });

          if (!wasEditingQ) {
            const totalWsQuestions = state.questions.filter((q) => isOwnedByTeacher(q, ws)).length;
            const latestWs = state.teachers.find((t) => t.id === ws.id) || ws;
            await saveRecordUnified('teachers', latestWs.id, {
              ...latestWs,
              targetQuestionCount: totalWsQuestions,
            });
            state.examQuestionCountInput = totalWsQuestions;
          }

          resetQuestionForm();
        },
        wasEditingQ
          ? 'Perubahan butir soal & analisis TKA berhasil disimpan!'
          : 'Butir soal TKA baru & hasil analisis kelayakan berhasil disimpan!'
      );
      renderApp();
    }

    function getFilteredRekapSessions() {
      const cur = getCurrentTeacher();
      if (!cur) return [];
      const cleanSessions = deduplicateSessionsList(state.sessions);
      let base = cur.role === 'guru' ? cleanSessions.filter((s) => s.teacherId === cur.id) : cleanSessions;

      if (cur.role === 'proktor' && state.rekapFilter.teacherId !== 'ALL') {
        base = base.filter((s) => s.teacherId === state.rekapFilter.teacherId);
      }

      return base.filter((s) => {
        const q = state.rekapFilter.search.trim().toLowerCase();
        const matchQuery =
          !q ||
          (s.studentName || '').toLowerCase().includes(q) ||
          (s.nisn || '').toLowerCase().includes(q) ||
          (s.studentClass || '').toLowerCase().includes(q) ||
          (s.subject || '').toLowerCase().includes(q);

        const matchStatus =
          state.rekapFilter.status === 'ALL' ||
          (state.rekapFilter.status === 'TUNTAS' && s.status === 'selesai' && s.passed) ||
          (state.rekapFilter.status === 'BELUM' && s.status === 'selesai' && !s.passed);

        return matchQuery && matchStatus;
      });
    }

    async function handleSaveEditedSession(e) {
      e.preventDefault();
      const m = state.editSessionModal;
      if (!m) return;

      const cleanName = (m.studentName || '').trim();
      const cleanNisn = (m.nisn || '').trim();
      const cleanClass = (m.studentClass || '').trim().toUpperCase();
      const numericScore = Math.max(0, Math.min(100, Number(m.score) || 0));
      const isFinished = m.status === 'selesai';

      if (!cleanName || !cleanNisn || !cleanClass) {
        showToast('Nama Siswa, NISN, dan Kelas wajib diisi.', 'error');
        return;
      }

      await runWithSavingAnimation(
        `Menyimpan perubahan data peserta ${cleanName}...`,
        async () => {
          await saveRecordUnified('sessions', m.id, {
            studentName: cleanName,
            nisn: cleanNisn,
            studentClass: cleanClass,
            teacherId: m.teacherId || '',
            teacherName: m.teacherName || '',
            subject: m.subject || '',
            tokenUsed: m.tokenUsed || '',
            score: isFinished ? numericScore : 0,
            passed: isFinished ? numericScore >= 75 : false,
            status: m.status,
            startedAt: m.startedAt || new Date().toISOString(),
            finishedAt: isFinished && !m.finishedAt ? new Date().toISOString() : m.finishedAt || '',
            tpBreakdownJson: m.tpBreakdownJson || JSON.stringify(m.tpBreakdown || []),
            answersJson: m.answersJson || JSON.stringify(m.answers || {}),
          });
          state.editSessionModal = null;
          renderModals();
        },
        `Perubahan data peserta ${cleanName} berhasil disimpan!`
      );
      renderApp();
    }

    function handleExportCsv() {
      const list = getFilteredRekapSessions();
      if (list.length === 0) {
        showToast('Tidak ada data nilai untuk diekspor.', 'error');
        return;
      }

      const headers = [
        'No',
        'Nama Siswa',
        'NISN / Username',
        'Kelas',
        'Mata Pelajaran',
        'Guru Pengampu',
        'Token Digunakan',
        'Status Pengerjaan',
        'Waktu Selesai',
        'Skor Akhir (0-100)',
        'Predikat Ketuntasan',
        'Rincian Ketercapaian TP',
      ];

      const rows = list.map((s, idx) => {
        const tpText = (s.tpBreakdown || [])
          .map((tp) => `${tp.tpCode}: ${tp.score}% (${tp.passed ? 'Tuntas' : 'Belum'})`)
          .join(' | ');
        return [
          idx + 1,
          `"${(s.studentName || '').replace(/"/g, '""')}"`,
          `"${(s.nisn || '').replace(/"/g, '""')}"`,
          `"${(s.studentClass || '').replace(/"/g, '""')}"`,
          `"${(s.subject || '').replace(/"/g, '""')}"`,
          `"${(s.teacherName || '').replace(/"/g, '""')}"`,
          `"${s.tokenUsed || ''}"`,
          s.status === 'selesai' ? 'Selesai' : 'Sedang Mengerjakan',
          `"${formatWaktuID(s.finishedAt)}"`,
          s.status === 'selesai' ? s.score : 0,
          s.status === 'selesai' ? (s.passed ? 'Tuntas' : 'Belum Tuntas') : 'Proses',
          `"${tpText}"`,
        ].join(',');
      });

      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `Rekap_Nilai_TKA_2026_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('File Rekap Nilai CSV/Excel berhasil diunduh!');
    }

    async function handleConnectSpreadsheet(e) {
      if (e) e.preventDefault();
      const cleanUrl = state.spreadsheetUrlInput.trim();
      if (!cleanUrl || !cleanUrl.startsWith('http')) {
        showToast(
          'Masukkan URL Web App Google Apps Script yang valid (berawalan https://script.google.com/...).',
          'error',
          'URL Tidak Valid'
        );
        return;
      }

      await runWithSavingAnimation(
        'Menghubungkan & membuat sheet otomatis di Google Spreadsheet...',
        async () => {
          const initRes = await postToSpreadsheet({ action: 'init' }, cleanUrl);
          if (!initRes || !initRes.ok) {
            throw new Error(initRes?.error || 'Gagal inisialisasi sheet');
          }
          state.spreadsheetApiUrl = cleanUrl;
          await fetchFromSpreadsheet(cleanUrl, false);
        },
        'Google Spreadsheet berhasil terhubung! Sheet database siap digunakan.'
      );
      renderApp();
    }
