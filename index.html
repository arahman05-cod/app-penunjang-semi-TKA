    function renderStudentExamView() {
      const ss = state.studentSession;
      if (!ss.profile || !ss.teacher || ss.questions.length === 0) return renderLoginView();

      const activeQ = ss.questions[ss.currentQIndex];
      const totalQ = ss.questions.length;
      const answeredCount = ss.questions.filter(isQuestionAnswered).length;
      const doubtCount = ss.questions.filter((q) => ss.doubtFlags[q.id]).length;
      const unansweredCount = totalQ - answeredCount;
      const vCount = Number(ss.violationCount) || 0;
      const vMax = Number(ss.maxViolations) || 3;

      const securityBadgeClass =
        vCount >= 2
          ? 'bg-rose-600 text-white border border-rose-300 animate-pulse'
          : vCount === 1
          ? 'bg-amber-500 text-white border border-amber-300'
          : 'bg-emerald-950/70 text-emerald-200 border border-emerald-600/60';

      const textSizeClass =
        ss.fontScale === 'sm' ? 'text-sm' : ss.fontScale === 'lg' ? 'text-lg leading-relaxed' : 'text-base leading-relaxed';

      let optionsHtml = '';
      if (activeQ.type === 'PG') {
        optionsHtml = `<div class="space-y-3">${(activeQ.options || [])
          .map((optText, optIdx) => {
            const selected = ss.answers[activeQ.id] === optIdx;
            return `
              <button type="button" onclick="selectPgOption('${activeQ.id}', ${optIdx})" class="w-full text-left p-3.5 rounded-xl border-2 transition-all flex items-start gap-3.5 ${
                selected ? 'border-[#0095ff] bg-sky-50/80 shadow-sm' : 'border-slate-200 hover:border-slate-300 bg-white'
              }">
                <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 ${
                  selected ? 'bg-[#0095ff] text-white' : 'bg-slate-100 text-slate-700'
                }">${OPTION_LETTERS[optIdx]}</span>
                <span class="text-slate-800 ${textSizeClass}">${escapeHtml(optText)}</span>
              </button>
            `;
          })
          .join('')}</div>`;
      } else if (activeQ.type === 'PG_KOMPLEKS') {
        const currentArr = Array.isArray(ss.answers[activeQ.id]) ? ss.answers[activeQ.id] : [];
        optionsHtml = `<div class="space-y-3">${(activeQ.options || [])
          .map((optText, optIdx) => {
            const checked = currentArr.includes(optIdx);
            return `
              <button type="button" onclick="togglePgKompleksOption('${activeQ.id}', ${optIdx})" class="w-full text-left p-3.5 rounded-xl border-2 transition-all flex items-start gap-3.5 ${
                checked ? 'border-[#0095ff] bg-sky-50/80 shadow-sm' : 'border-slate-200 hover:border-slate-300 bg-white'
              }">
                <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 border ${
                  checked ? 'bg-[#0095ff] text-white border-[#0095ff]' : 'bg-white text-slate-600 border-slate-300'
                }">${checked ? '✓' : OPTION_LETTERS[optIdx]}</span>
                <span class="text-slate-800 ${textSizeClass}">${escapeHtml(optText)}</span>
              </button>
            `;
          })
          .join('')}</div>`;
      } else {
        const ansObj = ss.answers[activeQ.id] || {};
        optionsHtml = `
          <div class="overflow-x-auto rounded-xl border border-slate-200">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-100 text-xs font-bold text-slate-700 border-b border-slate-200">
                  <th class="p-2.5 sm:p-3.5 min-w-[175px]">Pernyataan</th>
                  <th class="p-2.5 sm:p-3.5 text-center w-16 sm:w-24">Benar</th>
                  <th class="p-2.5 sm:p-3.5 text-center w-16 sm:w-24">Salah</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200">
                ${(activeQ.options || [])
                  .map((stmtText, sIdx) => {
                    const val = ansObj[sIdx];
                    return `
                      <tr class="hover:bg-slate-50/70">
                        <td class="p-2.5 sm:p-3.5 text-slate-800 ${textSizeClass}">${escapeHtml(stmtText)}</td>
                        <td class="p-2 sm:p-3 text-center">
                          <button type="button" onclick="setBenarSalahAnswer('${activeQ.id}', ${sIdx}, true)" class="min-h-[38px] sm:min-h-0 px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs font-bold border transition-all ${
                            val === true ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'
                          }">Benar</button>
                        </td>
                        <td class="p-2 sm:p-3 text-center">
                          <button type="button" onclick="setBenarSalahAnswer('${activeQ.id}', ${sIdx}, false)" class="min-h-[38px] sm:min-h-0 px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs font-bold border transition-all ${
                            val === false ? 'bg-rose-600 text-white border-rose-600 shadow-sm' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-100'
                          }">Salah</button>
                        </td>
                      </tr>
                    `;
                  })
                  .join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      const numberTilesHtml = ss.questions
        .map((q, idx) => {
          const answered = isQuestionAnswered(q);
          const doubt = Boolean(ss.doubtFlags[q.id]);
          const isCurrent = idx === ss.currentQIndex;
          let tileStyle = 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50';
          if (doubt) tileStyle = 'bg-amber-400 text-white border-amber-500';
          else if (answered) tileStyle = 'bg-emerald-600 text-white border-emerald-600';

          return `
            <button type="button" onclick="state.studentSession.currentQIndex=${idx};renderApp()" class="h-10 rounded-lg border-2 font-bold text-xs flex items-center justify-center transition-all ${tileStyle} ${
              isCurrent ? 'ring-2 ring-offset-1 ring-[#0095ff] scale-105' : ''
            }">${idx + 1}</button>
          `;
        })
        .join('');

      const mobileQuickJumpHtml = ss.questions
        .map((q, idx) => {
          const answered = isQuestionAnswered(q);
          const doubt = Boolean(ss.doubtFlags[q.id]);
          const isCurrent = idx === ss.currentQIndex;
          let pillStyle = 'bg-white text-slate-700 border-slate-300';
          if (doubt) pillStyle = 'bg-amber-400 text-white border-amber-500';
          else if (answered) pillStyle = 'bg-emerald-600 text-white border-emerald-600';

          return `
            <button type="button" onclick="state.studentSession.currentQIndex=${idx};renderApp()" class="w-8 h-8 rounded-lg border font-bold text-xs shrink-0 flex items-center justify-center ${pillStyle} ${
              isCurrent ? 'ring-2 ring-offset-1 ring-[#0095ff]' : ''
            }">${idx + 1}</button>
          `;
        })
        .join('');

      return `
        <div class="min-h-screen bg-[#f0f4f8] flex flex-col text-slate-800 select-none">
          <header class="bg-[#002b7a] text-white px-4 sm:px-6 py-3 shadow-md sticky top-0 z-20">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                ${renderLogoSvg(38)}
                <div>
                  <h1 class="text-sm sm:text-base font-extrabold leading-tight">Aplikasi Penunjang TKA — ${escapeHtml(ss.teacher.subject.toUpperCase())}</h1>
                  <p class="text-xs text-sky-200">Peserta: <span class="font-bold text-white">${escapeHtml(ss.profile.name)}</span> (${escapeHtml(ss.profile.studentClass)})</p>
                </div>
              </div>

              <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                <button type="button" onclick="requestExamFullscreen()" title="Aktifkan Layar Penuh" class="px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 ${securityBadgeClass}">
                  <span>Pelanggaran: ${vCount}/${vMax}</span>
                </button>

                <div class="flex items-center bg-white/10 rounded-lg p-1 text-xs">
                  <span class="hidden sm:inline px-2 text-sky-200">Ukuran Huruf:</span>
                  ${[
                    { id: 'sm', label: 'A-' },
                    { id: 'base', label: 'A' },
                    { id: 'lg', label: 'A+' },
                  ]
                    .map(
                      (f) =>
                        `<button type="button" onclick="state.studentSession.fontScale='${f.id}';renderApp()" class="px-2 py-1 rounded font-bold transition-all ${
                          ss.fontScale === f.id ? 'bg-white text-[#002b7a]' : 'text-white hover:bg-white/10'
                        }">${f.label}</button>`
                    )
                    .join('')}
                </div>

                <div id="exam-timer" class="px-3.5 py-1.5 rounded-lg font-mono font-extrabold text-sm flex items-center gap-2 shadow-inner ${
                  ss.remainingSeconds <= 300
                    ? 'bg-red-600 text-white animate-pulse'
                    : 'bg-sky-950 text-sky-200 border border-sky-700'
                }">
                  <span>Sisa Waktu: ${formatCountdown(ss.remainingSeconds)}</span>
                </div>
              </div>
            </div>
          </header>

          <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <section class="lg:col-span-8 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              <div class="bg-slate-50 px-5 py-3.5 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2.5">
                  <span class="px-3 py-1 rounded-lg bg-[#002b7a] text-white text-xs font-extrabold">SOAL NO. ${ss.currentQIndex + 1}</span>
                  <span class="px-2.5 py-1 rounded-md bg-sky-100 text-sky-800 text-xs font-bold">
                    ${activeQ.type === 'PG' ? 'Pilihan Ganda' : activeQ.type === 'PG_KOMPLEKS' ? 'Pilihan Ganda Kompleks' : 'Benar / Salah'}
                  </span>
                </div>
                <span class="text-xs font-semibold text-slate-500 bg-white px-2.5 py-1 rounded border border-slate-200">
                  Kode TP: <strong class="text-[#002b7a]">${escapeHtml(activeQ.tpCode)}</strong>
                </span>
              </div>

              <div class="lg:hidden px-4 py-2.5 bg-sky-50/70 border-b border-slate-200 flex items-center gap-2 overflow-x-auto">
                <span class="text-[11px] font-bold text-[#002b7a] shrink-0">Lompat Soal:</span>
                <div class="flex items-center gap-1.5">${mobileQuickJumpHtml}</div>
              </div>

              <div class="p-5 sm:p-7">
                <p class="text-xs font-medium text-slate-500 mb-3 italic">
                  ${
                    activeQ.type === 'PG'
                      ? 'Petunjuk: Pilihlah satu jawaban yang paling tepat.'
                      : activeQ.type === 'PG_KOMPLEKS'
                      ? 'Petunjuk: Pilihlah lebih dari satu jawaban yang benar (dapat mencentang beberapa opsi).'
                      : 'Petunjuk: Tentukan Benar atau Salah untuk setiap pernyataan di bawah ini.'
                  }
                </p>
                <div class="text-slate-800 whitespace-pre-line font-medium mb-6 ${textSizeClass}">${escapeHtml(activeQ.questionText)}</div>
                ${optionsHtml}
              </div>

              <div class="bg-slate-50 px-5 py-4 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
                <button type="button" ${ss.currentQIndex === 0 ? 'disabled' : ''} onclick="state.studentSession.currentQIndex=Math.max(0, state.studentSession.currentQIndex-1);renderApp()" class="px-4 py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all ${
                  ss.currentQIndex === 0 ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-slate-600 hover:bg-slate-700 text-white'
                }">← Soal Sebelumnya</button>

                <button type="button" onclick="toggleDoubtFlag('${activeQ.id}')" class="px-4 py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all ${
                  ss.doubtFlags[activeQ.id] ? 'bg-amber-500 text-white ring-2 ring-amber-300' : 'bg-amber-100 hover:bg-amber-200 text-amber-900'
                }">${ss.doubtFlags[activeQ.id] ? '⚑ Ditandai Ragu-ragu' : '⚑ Ragu-ragu'}</button>

                ${
                  ss.currentQIndex < totalQ - 1
                    ? `<button type="button" onclick="state.studentSession.currentQIndex=Math.min(${totalQ - 1}, state.studentSession.currentQIndex+1);renderApp()" class="px-5 py-2.5 rounded-lg bg-[#0095ff] hover:bg-[#0288d1] text-white text-xs sm:text-sm font-bold shadow-sm transition-all">Soal Berikutnya →</button>`
                    : `<button type="button" ${state.isSubmittingExam ? 'disabled' : ''} onclick="openSubmitExamConfirm()" class="px-5 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold shadow-sm transition-all">${state.isSubmittingExam ? 'Mengirim...' : 'Selesai Tes ✓'}</button>`
                }
              </div>
            </section>

            <aside class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-slate-200 p-5">
              <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
                <h3 class="text-sm font-bold text-slate-800">Daftar Nomor Soal</h3>
                <span class="text-xs font-semibold text-slate-500">${answeredCount}/${totalQ} Terjawab</span>
              </div>

              <div class="grid grid-cols-5 sm:grid-cols-8 lg:grid-cols-5 gap-2 sm:gap-2.5 mb-5">${numberTilesHtml}</div>

              <div class="space-y-2 text-xs text-slate-600 pt-3 border-t border-slate-100">
                <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-emerald-600 inline-block"></span><span>Sudah Dijawab (${answeredCount})</span></div>
                <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-amber-400 inline-block"></span><span>Ragu-ragu (${doubtCount})</span></div>
                <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-white border border-slate-300 inline-block"></span><span>Belum Dijawab (${unansweredCount})</span></div>
              </div>

              <button type="button" ${state.isSubmittingExam ? 'disabled' : ''} onclick="openSubmitExamConfirm()" class="mt-5 w-full py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm shadow-sm transition-all">
                ${state.isSubmittingExam ? 'Mengirim Jawaban...' : 'Selesai & Kumpulkan Tes'}
              </button>
            </aside>
          </main>
          ${renderFooterHtml()}
        </div>
      `;
    }

      if (!ss.profile || !ss.teacher || !ss.resultSummary) return renderLoginView();
      const res = ss.resultSummary;

      const tpBreakdownHtml =
        (res.tpBreakdown || []).length > 0
          ? `
          <div>
            <h3 class="text-sm font-bold text-slate-800 mb-3">Rincian Ketercapaian Tujuan Pembelajaran (TP)</h3>
            <div class="space-y-3">
              ${res.tpBreakdown
                .map(
                  (tp) => `
                  <div class="p-3.5 rounded-xl border border-slate-200 bg-white">
                    <div class="flex items-center justify-between gap-2 mb-1.5">
                      <span class="text-xs font-extrabold text-[#002b7a]">${escapeHtml(tp.tpCode)} (KKTP: ${tp.kktp})</span>
                      <span class="text-xs font-bold px-2 py-0.5 rounded ${
                        tp.passed ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                      }">Capaian: ${tp.score}% • ${tp.passed ? 'Tuntas' : 'Belum Tuntas'}</span>
                    </div>
                    <p class="text-xs text-slate-600 mb-2">${escapeHtml(tp.description)}</p>

                      <div class="h-full rounded-full ${tp.passed ? 'bg-emerald-500' : 'bg-amber-500'}" style="width: ${Math.min(100, tp.score)}%"></div>
                    </div>
                  </div>
                `
                )
                .join('')}
            </div>
          </div>

          : '';

      return `
        <div class="min-h-screen bg-[#f0f4f8] flex flex-col text-slate-800">
          <header class="bg-[#002b7a] text-white px-6 py-4 shadow-md flex items-center gap-3">
            ${renderLogoSvg(40)}
            <div>
              <h1 class="text-base sm:text-lg font-extrabold">Aplikasi Penunjang TKA — BUKTI PENYELESAIAN TES</h1>
              <p class="text-xs text-sky-200">Sistem Asesmen Terpadu Kurikulum Nasional 2026</p>
            </div>
          </header>

          <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-8">

                <div class="w-12 h-12 rounded-full bg-white/20 mx-auto mb-2 flex items-center justify-center text-2xl font-extrabold">${ss.isViolationAutoFinished ? '!' : '✓'}</div>
                <h2 class="text-xl sm:text-2xl font-extrabold">${ss.isViolationAutoFinished ? 'Tes Diakhiri Otomatis oleh Sistem Keamanan' : 'Jawaban Berhasil Dikirim ke Server!'}</h2>
                <p class="text-xs sm:text-sm ${ss.isViolationAutoFinished ? 'text-rose-100' : 'text-emerald-100'} mt-1">
                  ${
                    ss.isViolationAutoFinished
                      ? 'Batas pelanggaran keluar dari halaman ujian tercapai (3/3). Seluruh jawaban terakhir Anda telah otomatis dikumpulkan.'
                      : 'Terima kasih telah mengikuti Tes Kemampuan Akademik (TKA) dengan jujur.'
                  }

              </div>

              <div class="p-6 space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-center bg-slate-50 p-4 rounded-xl border border-slate-200">

                    <p class="text-xs text-slate-500">Identitas Peserta</p>
                    <p class="font-bold text-slate-900 text-base">${escapeHtml(ss.profile.name)}</p>
                    <p class="text-xs text-slate-600">NISN: <span class="font-mono">${escapeHtml(ss.profile.nisn)}</span> • Kelas: ${escapeHtml(ss.profile.studentClass)}</p>
                    <p class="text-xs text-[#002b7a] font-semibold pt-1">Mapel: ${escapeHtml(ss.teacher.subject)} (${escapeHtml(ss.teacher.name)})</p>

    function renderProktorDashboardView() {
      const curTeacher = getCurrentTeacher();
      if (!curTeacher) return renderLoginView();
      const isGuruRole = curTeacher.role === 'guru';
      if (isGuruRole && (state.proktorTab === 'tambah_guru' || state.proktorTab === 'spreadsheet_guide')) {
        state.proktorTab = 'beranda';

                  <input type="url" required value="${escapeHtml(state.spreadsheetUrlInput)}" oninput="state.spreadsheetUrlInput=this.value" placeholder="https://script.google.com/macros/s/.../exec" class="flex-1 px-3.5 py-2.5 rounded-lg border border-slate-300 font-mono text-xs" />
                  <button type="submit" class="px-5 py-2.5 rounded-lg bg-[#0095ff] hover:bg-[#0288d1] text-white font-bold shrink-0">
                    Hubungkan &amp; Inisialisasi Sheet
                  </button>
                  <button type="button" onclick="fetchFromSpreadsheet('', false)" class="px-4 py-2.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold shrink-0">
                    Sinkronkan Sekarang
                  </button>
                </div>
              </form>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-3 text-xs">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h4 class="text-sm font-extrabold text-slate-800">Kode Backend Google Apps Script (Code.gs)</h4>
                <div class="flex gap-2">
                  <button type="button" onclick="copyToClipboard(GOOGLE_APPS_SCRIPT_CODE, 'Kode Apps Script')" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold">
                    Salin Kode
                  </button>
                  <button type="button" onclick="handleDownloadAppsScript()" class="px-3 py-1.5 rounded-lg bg-[#002b7a] text-white font-bold">
                    Unduh Code.gs
                  </button>
                </div>
              </div>
              <pre class="p-3.5 rounded-xl bg-slate-900 text-sky-200 font-mono text-[11px] overflow-x-auto max-h-60">${escapeHtml(GOOGLE_APPS_SCRIPT_CODE)}</pre>
            </div>
          </div>
        `;
      }

      const activeTabTitle =
        sidebarNavItems.find((x) => x.id === state.proktorTab)?.label || 'Beranda';

      const drawerContainer = document.getElementById('feature-drawer-container');
      if (drawerContainer) {
        drawerContainer.innerHTML = state.mobileMenuOpen
          ? `
            <div class="fixed inset-0 z-50 md:hidden flex">
              <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-[1px]" onclick="toggleLeftSidebarMobile(false)"></div>
              <aside class="relative z-10 tka-left-sidebar flex flex-col h-full shadow-2xl animate-drawer-left">
                ${buildSidebarInnerHtml()}
              </aside>
            </div>
          `
          : '';
      }

      return `
        <div class="min-h-screen bg-[#f0f4f8] flex text-slate-800">
          <!-- Sidebar Kiri Desktop -->
          <aside class="hidden md:flex md:flex-col md:shrink-0 tka-left-sidebar sticky top-0 h-screen shadow-xl z-20">
            ${buildSidebarInnerHtml()}
          </aside>

          <!-- Area Konten Utama Kanan -->
          <div class="flex-1 flex flex-col min-w-0">
            <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3.5 sticky top-0 z-10 flex items-center justify-between gap-3">
              <div class="flex items-center gap-3 min-w-0">
                <button type="button" onclick="toggleLeftSidebarMobile(true)" class="md:hidden p-2 rounded-lg bg-[#002b7a] text-white font-bold text-xs" aria-label="Buka Menu Navigasi">
                  ☰
                </button>
                <div class="min-w-0">
                  <h2 class="text-base sm:text-lg font-extrabold text-[#002b7a] truncate">${escapeHtml(activeTabTitle)}</h2>
                  <p class="text-xs text-slate-500 truncate">Aplikasi Penunjang TKA 2026 • ${escapeHtml(wsTeacher.subject)}</p>
                </div>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <span class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sky-50 border border-sky-200 text-xs font-bold text-[#002b7a]">
                  Token: <span class="font-mono">${escapeHtml(wsTeacher.token)}</span>
                </span>
              </div>
            </header>

            <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
              ${workspaceSelectorHtml}
              ${mainTabHtml}
            </main>

            ${renderFooterHtml()}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 14. FUNGSI RENDER UTAMA, NAVIGASI SIDEBAR, TIMER & INISIALISASI
    // =========================================================================
    function toggleLeftSidebarMobile(open) {
      state.mobileMenuOpen = Boolean(open);
      renderApp();
    }

    function navigateProktorMenu(tabId, subTabId = '') {
      const curTeacher = getCurrentTeacher();
      if (curTeacher?.role === 'guru' && !['beranda', 'tp', 'rekap_nilai'].includes(tabId)) {
        state.proktorTab = 'beranda';
      } else {
        state.proktorTab = tabId;
      }
      if (subTabId) {
        state.tpSubTab = subTabId;
      }
      state.mobileMenuOpen = false;
      renderApp();
    }

    const ACTIVE_SESSION_STORAGE_KEY = 'pusmendik_tka_2026_active_session_v1';

    function saveActiveSessionState() {
      try {
        if (state.currentView === 'login') {
          localStorage.removeItem(ACTIVE_SESSION_STORAGE_KEY);
          return;
        }
        const payload = {
          currentView: state.currentView,
          activeTeacherId: state.activeTeacherId,
          selectedWorkspaceTeacherId: state.selectedWorkspaceTeacherId,
          proktorTab: state.proktorTab,
          tpSubTab: state.tpSubTab,
          studentSession:
            state.currentView.startsWith('student_') && state.studentSession?.profile
              ? {
                  ...state.studentSession,
                  violationWarningModal: null,
                  isEnteringFullscreen: false,
                  hasEnteredFullscreen: false,
                }
              : null,
        };
        localStorage.setItem(ACTIVE_SESSION_STORAGE_KEY, JSON.stringify(payload));
      } catch {}
    }

    function restoreActiveSessionState() {
      try {
        const raw = localStorage.getItem(ACTIVE_SESSION_STORAGE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (!saved || !saved.currentView || saved.currentView === 'login') return;

        if (saved.currentView === 'proktor' && saved.activeTeacherId) {
          const matched = state.teachers.find((t) => t.id === saved.activeTeacherId);
          if (!matched) {
            localStorage.removeItem(ACTIVE_SESSION_STORAGE_KEY);
            return;
          }
          state.activeTeacherId = matched.id;
          state.proktorTab = saved.proktorTab || 'beranda';
          state.tpSubTab = saved.tpSubTab || 'tp_generator';
          if (matched.role === 'guru') {
            state.selectedWorkspaceTeacherId = matched.id;
          } else if (
            saved.selectedWorkspaceTeacherId &&
            state.teachers.some((t) => t.id === saved.selectedWorkspaceTeacherId)
          ) {
            state.selectedWorkspaceTeacherId = saved.selectedWorkspaceTeacherId;
          }
          const ws = getWorkspaceTeacher() || matched;
          state.examDurationInput = Number(ws.durationMinutes) || 60;
          const wsQCount = state.questions.filter((q) => isOwnedByTeacher(q, ws)).length;
          state.examQuestionCountInput =
            wsQCount > 0
              ? Math.min(wsQCount, Number(ws.targetQuestionCount) || wsQCount)
              : Number(ws.targetQuestionCount) || 5;
          state.currentView = 'proktor';
          return;
        }

        if (
          ['student_confirm', 'student_exam', 'student_result'].includes(saved.currentView) &&
          saved.studentSession?.profile &&
          saved.studentSession?.teacher
        ) {
          state.studentSession = {
            ...state.studentSession,
            ...saved.studentSession,
            violationWarningModal: null,
            isEnteringFullscreen: false,
            hasEnteredFullscreen: false,
          };
          state.currentView = saved.currentView;
        }
      } catch {
        try {
          localStorage.removeItem(ACTIVE_SESSION_STORAGE_KEY);
        } catch {}
      }
    }

    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      saveActiveSessionState();

      if (state.currentView !== 'proktor') {
        const drawerContainer = document.getElementById('feature-drawer-container');
        if (drawerContainer) drawerContainer.innerHTML = '';
      }

      if (state.currentView === 'student_confirm') {
        root.innerHTML = renderStudentConfirmView();
      } else if (state.currentView === 'student_exam') {
        root.innerHTML = renderStudentExamView();
      } else if (state.currentView === 'student_result') {
        root.innerHTML = renderStudentResultView();
      } else if (state.currentView === 'proktor') {
        root.innerHTML = renderProktorDashboardView();
      } else {
        root.innerHTML = renderLoginView();
      }

      renderModals();
    }

    let globalIntervalId = null;

    function startBackgroundTimers() {
      if (globalIntervalId) clearInterval(globalIntervalId);
      globalIntervalId = setInterval(() => {
        const clockEl = document.getElementById('live-clock');
        if (clockEl) {
          const now = new Date();
          clockEl.textContent = `${now.toLocaleDateString('id-ID', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
          })} ${now.toLocaleTimeString('id-ID')}`;
        }

        if (state.currentView === 'student_exam') {
          if (state.studentSession.remainingSeconds > 0) {
            state.studentSession.remainingSeconds -= 1;
            if (state.studentSession.remainingSeconds % 5 === 0) {
              saveActiveSessionState();
            }
            const timerEl = document.getElementById('exam-timer');
            if (timerEl) {
              timerEl.innerHTML = `<span>Sisa Waktu: ${formatCountdown(state.studentSession.remainingSeconds)}</span>`;
              if (state.studentSession.remainingSeconds <= 300) {
                timerEl.className =
                  'px-3.5 py-1.5 rounded-lg font-mono font-extrabold text-sm flex items-center gap-2 shadow-inner bg-red-600 text-white animate-pulse';
              }
            }
            if (state.studentSession.remainingSeconds <= 0) {
              handleFinishExam(true);
            }
          }
        }
      }, 1000);
    }

    function setupStudentExamSecurityListeners() {
      document.addEventListener('visibilitychange', () => {
        if (state.currentView === 'student_exam' && document.hidden) {
          registerStudentViolation('Berpindah tab atau menyembunyikan jendela browser ujian');
        }
      });

      window.addEventListener('blur', () => {
        if (state.currentView === 'student_exam') {
          if (isTouchMobileOrTabletDevice() && !document.hidden) {
            return;
          }
          registerStudentViolation('Keluar dari layar aplikasi ujian atau membuka aplikasi lain');
        }
      });

      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
          state.studentSession.hasEnteredFullscreen = true;
          return;
        }
        if (
          state.currentView === 'student_exam' &&
          !document.fullscreenElement &&
          state.studentSession.hasEnteredFullscreen &&
          !state.studentSession.isEnteringFullscreen &&
          !state.isSubmittingExam
        ) {
          registerStudentViolation('Keluar dari mode layar penuh (Fullscreen)');
        }
      });

      document.addEventListener('contextmenu', (e) => {
        if (state.currentView === 'student_exam') {
          e.preventDefault();
          showToast('Klik kanan dinonaktifkan selama ujian berlangsung.', 'warning', 'Keamanan Ujian');
        }
      });

      ['copy', 'cut', 'paste'].forEach((evtName) => {
        document.addEventListener(evtName, (e) => {
          if (state.currentView === 'student_exam') {
            e.preventDefault();
            showToast('Menyalin atau menempel teks dilarang selama ujian berlangsung.', 'warning', 'Keamanan Ujian');
          }
        });
      });

      document.addEventListener('keydown', (e) => {
        if (state.currentView !== 'student_exam') return;
        const key = String(e.key || '').toLowerCase();
        const isCtrlOrMeta = e.ctrlKey || e.metaKey;

        if (
          e.key === 'F12' ||
          (isCtrlOrMeta && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) ||
          (isCtrlOrMeta && (key === 't' || key === 'n' || key === 'w'))
        ) {
          e.preventDefault();
          registerStudentViolation('Mencoba membuka tab/jendela baru atau alat pengembang');
          return;
        }

        if (isCtrlOrMeta && (key === 'c' || key === 'v' || key === 'x' || key === 'a' || key === 'u' || key === 's' || key === 'p')) {
          e.preventDefault();
          showToast('Pintasan keyboard tersebut dinonaktifkan selama ujian.', 'warning', 'Keamanan Ujian');
        }
      });
    }

    window.onload = async function () {
      loadLocalBackupDb();
      restoreActiveSessionState();
      state.geminiApiKeyInput = getStoredGeminiApiKey();
      setupStudentExamSecurityListeners();
      renderApp();
      startBackgroundTimers();
      if (isSpreadsheetMode()) {
        await fetchFromSpreadsheet(state.spreadsheetApiUrl, true);
      }
    };
  </script>
</body>
</html>
